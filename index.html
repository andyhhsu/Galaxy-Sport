<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Galaxy 揮汗有禮 - 星動抽獎</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        galaxy: {
                            blue: '#1446FF',
                            cyan: '#00F2FE',
                            neon: '#00FF87',
                            orange: '#FF5722',
                            dark: '#080C14',
                            surface: '#0F172A',
                            border: 'rgba(255, 255, 255, 0.12)'
                        }
                    },
                    animation: {
                        'glow-pulse': 'glowPulse 2.5s infinite ease-in-out',
                        'float-soft': 'floatSoft 3s ease-in-out infinite',
                        'spin-slow': 'spin 20s linear infinite'
                    },
                    keyframes: {
                        glowPulse: {
                            '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                            '50%': { opacity: '0.85', transform: 'scale(1.03)' }
                        },
                        floatSoft: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' }
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,800;1,900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for Celebration Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Tone.js for Native High-Tech Sound Synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #060910;
            color: #F8FAFC;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(20, 70, 255, 0.28) 0%, transparent 55%),
                radial-gradient(circle at 10% 40%, rgba(0, 255, 135, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 60%, rgba(0, 242, 254, 0.14) 0%, transparent 45%),
                linear-gradient(180deg, #050811 0%, #080C16 100%);
            background-attachment: fixed;
        }

        .title-sport {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* --- 旗艦 Galaxy 腕錶風格轉盤容器 --- */
        .wheel-outer-chassis {
            position: relative;
            width: 88vw;
            max-width: 375px;
            height: 88vw;
            max-height: 375px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 12px;
            /* 模擬 Galaxy Watch Ultra 鈦合金立體外框 */
            background: linear-gradient(135deg, #2A364F 0%, #0F172A 50%, #1A2438 100%);
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.15),
                0 18px 45px -10px rgba(0, 0, 0, 0.9),
                0 0 35px rgba(0, 255, 135, 0.2),
                inset 0 2px 4px rgba(255, 255, 255, 0.25),
                inset 0 -3px 8px rgba(0, 0, 0, 0.8);
        }

        /* 外部 LED 刻度環光暈 */
        .wheel-outer-chassis::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #00FF87, #00F2FE, #1446FF, #FF5722, #00FF87);
            z-index: -1;
            opacity: 0.7;
            filter: blur(8px);
            animation: spin-slow 22s linear infinite;
        }

        /* 輪盤內部旋轉主體 */
        .wheel-core-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.85);
            background: #0B111E;
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            transition: transform 5.4s cubic-bezier(0.12, 0.85, 0.18, 1);
            will-change: transform;
        }

        /* --- 頂級立體指針 --- */
        .wheel-pointer-assembly {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
            pointer-events: none;
        }

        .pointer-gem {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFF 15%, #00FF87 70%, #059669 100%);
            border: 2px solid #FFF;
            box-shadow: 0 0 12px #00FF87;
            margin-bottom: -5px;
            z-index: 2;
        }

        .pointer-arrow {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 32px solid #00FF87;
            position: relative;
        }

        .pointer-arrow::after {
            content: '';
            position: absolute;
            top: -30px;
            left: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 20px solid #FFFFFF;
        }

        /* --- 轉盤核心 GO 觸發鈕 --- */
        .wheel-hub-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24%;
            height: 24%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #2A364F, #080C14 85%);
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.9),
                0 0 15px rgba(0, 242, 254, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.4);
            z-index: 25;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .wheel-hub-btn:active {
            transform: translate(-50%, -50%) scale(0.94);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }

        /* 運動感光澤按鈕 */
        .action-gradient-btn {
            background: linear-gradient(100deg, #00FF87 0%, #00F2FE 100%);
            color: #060910;
            font-weight: 900;
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .action-gradient-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: skewX(-20deg);
            transition: 0.6s;
        }
        .action-gradient-btn:hover::after {
            left: 140%;
        }
        .action-gradient-btn:active {
            transform: scale(0.98);
        }
        .action-gradient-btn:disabled {
            background: #1E293B;
            color: #64748B;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 科技感玻璃擬態 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glow-border {
            border: 1px solid rgba(0, 255, 135, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.15);
        }

        /* 兌換券卡片邊緣凹槽效果 */
        .ticket-notch {
            position: relative;
            background: #0B1120;
            border: 1px solid rgba(0, 255, 135, 0.4);
        }
        .ticket-notch::before, .ticket-notch::after {
            content: '';
            position: absolute;
            top: 58%;
            width: 20px;
            height: 20px;
            background: #060910;
            border-radius: 50%;
            z-index: 10;
        }
        .ticket-notch::before { left: -11px; }
        .ticket-notch::after { right: -11px; }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-100 selection:bg-emerald-500 selection:text-black" onload="initApp()">

    <!-- 中獎兌換彈跳視窗 -->

            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold mb-3 tracking-widest uppercase">

            </div>
            
            <h3 class="text-xl font-black text-white tracking-wide">
                恭喜獲得運動應援禮

            <!-- 獎項卡片 -->
            <div class="my-5 py-6 px-3 bg-gradient-to-b from-slate-900/80 to-slate-950/90 rounded-2xl border border-slate-800 shadow-inner relative overflow-hidden">
                <div class="absolute -right-8 -top-8 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl pointer-events-none"></div>
                <div class="absolute -left-8 -bottom-8 w-24 h-24 bg-cyan-500/10 rounded-full blur-xl pointer-events-none"></div>

                <p class="text-xs text-slate-400 font-medium tracking-wider mb-2">中獎品項</p>
                <div id="prizeNameDisplay" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-cyan-300 to-white drop-shadow-[0_0_15px_rgba(0,255,135,0.4)] leading-tight py-1">
                    <!-- 動態填入中獎名稱 -->
                </div>
            </div>

            <div class="space-y-1 text-xs text-slate-300 mb-6 bg-slate-900/40 p-3 rounded-xl border border-slate-800/80">
                <p class="font-bold text-cyan-300 flex items-center justify-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    兌換憑證已生效
                </p>
                <p class="text-slate-400">請保持本畫面並交由門市夥伴完成核銷領取</p>
            </div>
            
            <button 
                onclick="closeModal()" 
                class="w-full bg-slate-800 hover:bg-slate-700 active:bg-slate-900 border border-slate-600/80 text-white font-bold py-3.5 rounded-xl transition text-sm tracking-wider"

                完成並出示店員

    <!-- 內建系統浮動通知 (完全取代原生 alert) -->
    <div id="toastNotification" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 max-w-xs w-[90%] glass-panel border border-rose-500/40 bg-slate-900/95 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none">
        <div class="w-8 h-8 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <p id="toastMessage" class="text-xs font-medium leading-tight text-slate-200"></p>
    </div>

    <script>
        // ==========================================
        // --- 核心系統設定 (與後端完全同步) ---
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbxgNbp_PGLZrWLiWrMqkpcn3savo_0mmO7zhZ_fI8qoQRG2LlSDg46IJ0AegnMM5eDkaw/exec";
        const isMockMode = API_URL.trim() === "";

        // ==========================================
        // --- Tone.js 專屬科技音效引擎 (免外部音檔) ---
        // ==========================================
        let isAudioEnabled = true;
        let audioInitialized = false;
        let spinTickerTimer = null;

        // 1. 轉盤指針機械刻度音 (Pluck/Tick)
        const tickSynth = new Tone.MembraneSynth({
            pitchDecay: 0.008,
            octaves: 2,
            oscillator: { type: "sine" },
            envelope: { attack: 0.001, decay: 0.04, sustain: 0, release: 0.04 }
        }).toDestination();
        tickSynth.volume.value = -6;

        // 2. 啟動高科技充能音 (Charge-up sweep)
        const chargeSynth = new Tone.Synth({
            oscillator: { type: "triangle" },
            envelope: { attack: 0.02, decay: 0.15, sustain: 0.1, release: 0.3 }
        }).toDestination();
        chargeSynth.volume.value = -10;

        // 3. 中獎勝利慶典音效 (Poly Synth 和弦與琶音)
        const celebrationSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle8" },
            envelope: { attack: 0.02, decay: 0.3, sustain: 0.2, release: 1.2 }
        }).toDestination();
        celebrationSynth.volume.value = -4;

        // 4. 警示提示音
        const alertSynth = new Tone.Synth({
            oscillator: { type: "sine" },
            envelope: { attack: 0.01, decay: 0.15, sustain: 0, release: 0.1 }
        }).toDestination();
        alertSynth.volume.value = -8;

        // 確保手機瀏覽器在第一次使用者點擊時喚醒 AudioContext
        async function ensureAudioReady() {
            if (!audioInitialized && isAudioEnabled) {
                try {
                    await Tone.start();
                    audioInitialized = true;
                } catch (e) {
                    console.warn("音訊初始化略過：", e);
                }
            }
        }

        // 音效開關切換
        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const icon = document.getElementById('soundIcon');
            icon.innerText = isAudioEnabled ? '🔊' : '🔇';
            if (isAudioEnabled) {
                ensureAudioReady();
                playTickSound();
            }
        }

        // 播放指針撥動卡嗒聲
        function playTickSound() {
            if (!isAudioEnabled) return;
            try {
                // 微調音高帶出擬真機械刻度感
                const notes = ["C5", "D5", "G5", "E5"];
                const randomNote = notes[Math.floor(Math.random() * notes.length)];
                tickSynth.triggerAttackRelease(randomNote, "32n");
            } catch (e) {}
        }

        // 模擬轉盤 5.4 秒漸層減速音效節奏
        function playSpinDecelerationSounds(totalDurationMs = 5400) {
            if (!isAudioEnabled) return;
            if (spinTickerTimer) clearTimeout(spinTickerTimer);

            const startTime = Date.now();
            let interval = 55; // 初始高速旋轉 (55ms 敲擊一次)

            function nextTick() {
                const elapsed = Date.now() - startTime;
                if (elapsed >= totalDurationMs - 200) return; // 動畫即將結束時停止

                playTickSound();

                // 依據旋轉時間動態拉長刻度間隔 (模擬自然減速)
                const progress = elapsed / totalDurationMs;
                if (progress < 0.4) {
                    interval = 55 + (progress * 80); // 輕微加速到平穩
                } else if (progress < 0.75) {
                    interval = 90 + Math.pow((progress - 0.4) * 3, 2) * 120; // 逐漸拉長
                } else {
                    interval = 220 + Math.pow((progress - 0.75) * 4, 3) * 280; // 最後幾格沉穩倒數
                }

                spinTickerTimer = setTimeout(nextTick, interval);
            }

            nextTick();
        }

        // 播放中獎璀璨音效
        function playWinningFanfare() {
            if (!isAudioEnabled) return;
            try {
                const now = Tone.now();
                // 1. 快速璀璨上升琶音 (Galaxy 運動能量感)
                celebrationSynth.triggerAttackRelease("G4", "16n", now);
                celebrationSynth.triggerAttackRelease("C5", "16n", now + 0.08);
                celebrationSynth.triggerAttackRelease("E5", "16n", now + 0.16);
                celebrationSynth.triggerAttackRelease("G5", "16n", now + 0.24);
                celebrationSynth.triggerAttackRelease("C6", "8n", now + 0.32);

                // 2. 宏亮大和弦結尾 (C Major Add9)
                setTimeout(() => {
                    if (isAudioEnabled) {
                        celebrationSynth.triggerAttackRelease(["C4", "G4", "C5", "E5", "D6"], "1.5s");
                    }
                }, 450);
            } catch (e) {}
        }

        // 播放錯誤/警示音
        function playAlertSound() {
            if (!isAudioEnabled) return;
            try {
                const now = Tone.now();
                alertSynth.triggerAttackRelease("E4", "16n", now);
                alertSynth.triggerAttackRelease("C4", "16n", now + 0.12);
            } catch (e) {}
        }

        // 預設 7 個獎項與旗艦運動深邃漸層色彩
        let prizes = [
            { id: 1, name: "環保收納盒", color: "#00E676", gradColor: "#00B0FF", textColor: "#000000" },
            { id: 2, name: "手機擦拭布", color: "#1E3A8A", gradColor: "#172554", textColor: "#FFFFFF" },
            { id: 3, name: "AI帆布袋",   color: "#FF6D00", gradColor: "#DD2C00", textColor: "#FFFFFF" },
            { id: 4, name: "木製杯墊",   color: "#1F2937", gradColor: "#111827", textColor: "#F3F4F6" },
            { id: 5, name: "行動電源",   color: "#FFD600", gradColor: "#FFAB00", textColor: "#000000" },
            { id: 6, name: "吸管跳跳杯", color: "#EC4899", gradColor: "#BE185D", textColor: "#FFFFFF" },
            { id: 7, name: "放鬆筋膜槍", color: "#0F172A", gradColor: "#020617", textColor: "#00FF87" }
        ];

        let currentRotation = 0;
        let isSpinning = false;

        // --- 訊息提示 (取代原生 alert) ---
        function showNotification(msg) {
            playAlertSound();
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3200);
        }

        // --- 初始化應用 ---
        async function initApp() {
            if (!isMockMode) {
                const demoBadge = document.getElementById('demo-badge');
                if (demoBadge) demoBadge.style.display = 'none';
                
                try {
                    // 從後端 GAS 獲取目前最新獎項庫存設定
                    const response = await fetch(API_URL);
                    const cloudPrizes = await response.json();
                    
                    if (cloudPrizes && Array.isArray(cloudPrizes) && cloudPrizes.length > 0) {
                        prizes = cloudPrizes.map((p, idx) => {
                            const fallback = prizes[idx % prizes.length];
                            return {
                                id: p.id || idx + 1,
                                name: p.name,
                                color: p.color || fallback.color,
                                gradColor: fallback.gradColor || '#111827',
                                textColor: p.textColor || fallback.textColor
                            };
                        });
                    }
                } catch (e) {
                    console.warn("使用本地精緻配色繪製轉盤：", e);
                }
            }
            drawHighTechWheel();
        }

        // --- 繪製運動科技感轉盤 ---
        function drawHighTechWheel() {
            const canvas = document.getElementById('wheelCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            // 視網膜高清晰度縮放 (Retina Display)
            const parentWidth = canvas.parentElement.clientWidth;
            const dpr = window.devicePixelRatio || 2;
            canvas.width = parentWidth * dpr;
            canvas.height = parentWidth * dpr;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            
            const radius = canvas.width / 2;
            const centerX = radius;
            const centerY = radius;
            
            if (!prizes || prizes.length === 0) return;
            const arcSize = (2 * Math.PI) / prizes.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < prizes.length; i++) {
                const angle = i * arcSize;
                
                // 1. 繪製扇形漸層
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize, false);
                ctx.closePath();

                // 徑向金屬與微光漸層
                const radGrad = ctx.createRadialGradient(
                    centerX, centerY, radius * 0.2,
                    centerX, centerY, radius
                );
                radGrad.addColorStop(0, prizes[i].color || '#1e293b');
                radGrad.addColorStop(1, prizes[i].gradColor || '#0f172a');
                
                ctx.fillStyle = radGrad;
                ctx.fill();

                // 2. 扇形邊界光條
                ctx.lineWidth = 3 * (dpr / 2);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
                ctx.stroke();
                ctx.restore();

                // 3. 繪製精緻外圍 LED 點點
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);

                const dotDistance = radius - (14 * (dpr / 2));
                ctx.beginPath();
                ctx.arc(dotDistance, 0, 3 * (dpr / 2), 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                ctx.shadowColor = "#00FF87";
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();

                // 4. 文字排版
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = prizes[i].textColor || "#FFFFFF";
                
                // 根據畫面動態適配文字尺寸
                const fontSize = Math.max(22, Math.floor(26 * (dpr / 2)));
                ctx.font = `900 ${fontSize}px 'Noto Sans TC', sans-serif`;
                
                // 陰影增加科技對比
                ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
                let text = prizes[i].name || '';
                if (text.length > 6) {
                    text = text.substring(0, 5) + '..';
                }
                
                // 文字位置保留邊距
                const textMargin = 38 * (dpr / 2);
                ctx.fillText(text, radius - textMargin, 0);
                ctx.restore();
            }

            // 5. 轉盤最外圈內陰影環
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius - (4 * (dpr / 2)), 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(0, 242, 254, 0.35)";
            ctx.lineWidth = 4 * (dpr / 2);
            ctx.stroke();
            ctx.restore();
        }

        // --- 視窗大小改變時重繪轉盤 ---
        window.addEventListener('resize', () => {
            if (!isSpinning) drawHighTechWheel();
        });

        // --- 啟動抽獎核心邏輯 ---
        async function startSpin() {
            if (isSpinning) return;
            await ensureAudioReady();

            const phoneInput = document.getElementById('phoneInput');
            const spinBtn = document.getElementById('spinBtn');
            const spinBtnText = document.getElementById('spinBtnText');
            const phone = phoneInput.value.trim();

            // 手機號碼格式防護 (09開頭10碼)
            if (!/^09\d{8}$/.test(phone)) {
                showNotification('請輸入正確的 10 碼手機號碼 (09開頭)');
                phoneInput.focus();
                return;
            }

            // 播放啟動充能音
            if (isAudioEnabled) {
                chargeSynth.triggerAttackRelease("C4", "16n");
                setTimeout(() => chargeSynth.triggerAttackRelease("G4", "8n"), 100);
            }

            // 鎖定 UI
            isSpinning = true;
            phoneInput.disabled = true;
            spinBtn.disabled = true;
            spinBtnText.innerText = '星動連線核驗中...';

            let resultPrizeName = "";
            let winningIndex = 0;

            if (isMockMode) {
                // 模擬模式
                await new Promise(r => setTimeout(r, 600));
                winningIndex = Math.floor(Math.random() * prizes.length);
                resultPrizeName = prizes[winningIndex].name;
            } else {
                try {
                    // 正式呼叫後端 Google Apps Script
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ phone: phone, action: 'draw' }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    
                    const data = await response.json();
                    
                    if (data.status === 'error') {
                        showNotification(data.message || '很抱歉，此門號無法參加抽獎');
                        resetUI();
                        return;
                    }

                    resultPrizeName = data.prize;
                    winningIndex = prizes.findIndex(p => p.name === resultPrizeName);
                    
                    // 若後端品項前端未建檔，安全回退到第一格
                    if (winningIndex === -1) winningIndex = 0;

                } catch (error) {
                    console.error("後端連線異常：", error);
                    showNotification('連線逾時，請確認門市網路狀態或洽工作人員');
                    resetUI();
                    return;
                }
            }

            // 動態轉盤啟動
            spinBtnText.innerText = '能量轉動中...';
            
            const canvas = document.getElementById('wheelCanvas');
            const arcSize = 360 / prizes.length;
            
            // 指針位於上方 12 點鐘方向 (270度)
            const targetAngle = 270 - (winningIndex * arcSize) - (arcSize / 2);
            const extraSpins = 360 * (6 + Math.floor(Math.random() * 3)); // 額外轉 6-8 圈
            
            currentRotation = currentRotation + extraSpins + targetAngle - (currentRotation % 360);
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // 同步觸發物理減速棘輪音效
            playSpinDecelerationSounds(5400);

            // 等待旋轉動畫完成
            setTimeout(() => {
                showResult(resultPrizeName);
            }, 5500);
        }

        // --- 顯示中獎視窗與彩花效果 ---
        function showResult(prizeName) {
            // 播放勝利慶祝和弦與琶音
            playWinningFanfare();

            document.getElementById('prizeNameDisplay').innerText = prizeName;
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('modalContent');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 30);

            // 噴發勝利彩花 (Galaxy 科技配色：螢光綠、電光藍、暖橘)
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#00FF87', '#00F2FE', '#FF5722', '#FFFFFF']
                });
            }

            document.getElementById('spinBtnText').innerText = '今日抽獎已完成';
        }

        // --- 關閉彈窗 ---
        function closeModal() {
            showNotification('已記錄！請向門市人員出示此畫面兌換好禮。');
            const modal = document.getElementById('resultModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // --- 重置 UI 狀態 ---
        function resetUI() {
            isSpinning = false;
            const phoneInput = document.getElementById('phoneInput');
            const spinBtn = document.getElementById('spinBtn');
            const spinBtnText = document.getElementById('spinBtnText');

            phoneInput.disabled = false;
            spinBtn.disabled = false;
            spinBtnText.innerText = '啟動星動轉盤';
        }
    </script>
</body>
